name: Publish v1.1.2

on:
  push:
    branches: ['release/v1.1.2']

permissions:
  contents: read

concurrency:
  group: publish-v1.1.2
  cancel-in-progress: false

jobs:
  test:
    name: PHP ${{ matrix.php }} release gate
    if: github.repository == 'componenta/iterator' && github.ref == 'refs/heads/release/v1.1.2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2c444d7fa46ab1472968a1976d77676367f9e0b7
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: vendor/bin/pest --reverse-order
      - run: vendor/bin/pest --order-by=random --random-order-seed=20261126

  publish:
    name: Publish v1.1.2
    needs: test
    if: github.repository == 'componenta/iterator' && github.ref == 'refs/heads/release/v1.1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 2c444d7fa46ab1472968a1976d77676367f9e0b7
      TAG: v1.1.2
    steps:
      - name: Verify target and create release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Fixes
          - Prevent active shallow clones from consuming the same one-shot source independently.
          - Preserve original exceptions when source cleanup also fails.
          - Never accept an interrupted or unfinished Fiber read as a successful traversal.
          - Preserve null keys in traversal and normalize them for array conversion.
          
          ## Verification
          Pest on PHP 8.4 and 8.5, in normal, deterministic random and reverse order. Updated English and Russian documentation.
          
          Behavior corrections: use cursor() or replay() for independent traversal of an active source; completed caches remain cloneable.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'v1.1.2 — Replay integrity and Fiber safety' --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease
