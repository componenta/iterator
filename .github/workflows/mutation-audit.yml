name: Mutation Audit

on:
  workflow_dispatch:

jobs:
  mutate:
    name: Pest mutation testing PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run mutation audit
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/pest --mutate --everything --parallel 2>&1 | tee mutation-report.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-php-${{ matrix.php }}
          path: mutation-report.txt
          if-no-files-found: error
